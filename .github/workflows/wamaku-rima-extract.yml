name: Wamaku Rima ArcGIS Data Export
on:
  push:
    branches:
      - data/wamaku-rima-20261028
    paths:
      - tools/wamaku_rima_export.py
      - .github/workflows/wamaku-rima-extract.yml
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial processing libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "geopandas==1.1.1" "fiona==1.10.1" "requests>=2.32" "matplotlib>=3.9"
      - name: Fetch GIS data and clip to user supplied catchment
        run: python tools/wamaku_rima_export.py
      - name: Upload verified ArcGIS shapefile package
        uses: actions/upload-artifact@v4
        with:
          name: Wamaku_Rima_ArcGIS_Layers
          path: Wamaku_Rima_ArcGIS_Layers.zip
          if-no-files-found: error
          retention-days: 30
