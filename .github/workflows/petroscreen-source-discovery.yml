name: PetroScreen open-data feasibility (research only)

on:
  pull_request:
    paths:
      - 'petroscreen-ng/**'
      - '.github/workflows/petroscreen-source-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial libraries
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2
      - name: Test source audit contract (offline)
        run: python -m unittest discover -s petroscreen-ng -p "test_*.py" -v
      - name: Probe public dataset landing pages (informational only)
        run: python petroscreen-ng/audit_sources.py
      - name: Acquire actual Bayelsa polygon from public source
        run: python petroscreen-ng/verify_boundary.py
      - name: Inspect actual ESA and JRC COG pixel windows
        run: python petroscreen-ng/raster_acquisition.py
      - name: Preserve acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-g0-acquisition-evidence
          path: |
            petroscreen-ng/source_probe_results.json
            petroscreen-ng/boundary_acquisition_report.json
            petroscreen-ng/raster_probe_results.json
          retention-days: 14

  bayelsa-coverage:
    needs: source-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific raster libraries
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2
      - name: Acquire complete Bayelsa source raster windows and write clipped GeoTIFFs
        run: python petroscreen-ng/acquire_bayelsa.py
      - name: Validate derived file hashes and geodesic polygon-area consistency
        run: python petroscreen-ng/validate_bayelsa.py
      - name: Preserve derived raster sources and transparent coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-bayelsa-source-clips
          path: petroscreen-ng/artifacts_bayelsa/
          retention-days: 14
          if-no-files-found: warn
