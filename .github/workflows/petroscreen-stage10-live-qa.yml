name: Verify live PetroScreen Stage10 GitHub Pages release

on:
  push:
    branches: ['research/petroscreen-ng-stage10-parity-exports-fieldrecord']
    paths: ['.github/workflows/petroscreen-stage10-live-qa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm public HTML, JS, nine-state source manifest and raster checksum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,hashlib,json,time
          root="https://bahagogabriel.com/petroscreen/"
          def fetch(path,timeout=40):
            request=urllib.request.Request(root+path,headers={
              "User-Agent":"PetroScreenNG-Stage10-Live-Release-Test"
            })
            with urllib.request.urlopen(request,timeout=timeout) as resp:
              assert resp.status==200,resp.status
              return resp.read()
          for attempt in range(21):
            try:
              html=fetch("").decode("utf-8")
              if all(text in html for text in (
                "VERSION 1.0","id=\"download-data-json\"",
                "id=\"download-data-csv\"","id=\"download-field-csv\"",
                "id=\"field-checklist\"")):break
            except Exception as exc:
              print("PAGES_RETRY:",type(exc).__name__)
            if attempt==20:raise RuntimeError("Stage10 public HTML not yet deployed")
            time.sleep(9)
          prefix='src="./assets/'
          assert prefix in html
          filename=html.split(prefix,1)[1].split('"',1)[0]
          assert filename.endswith(".js")
          script=fetch("assets/"+filename).decode("utf-8")
          for token in ("ScreeningCase/1.0","nearest_mapped_pixel_centre",
                        "requires_follow_up","field verification",
                        "download-data-json","download-field-csv"):
            assert token in script, "New export module missing: "+token
          m=json.loads(fetch("data/manifest.json"))
          assert len(m["states"])==len(m["state_sources"])==9
          assert sum(len(s["source_files"]) for s in m["state_sources"])==31
          delta=next(s for s in m["state_sources"] if s["state"]=="Delta")
          source=next(f for f in delta["source_files"] if f["kind"]=="worldcover")
          assert hashlib.sha256(fetch("data/"+source["file"],120)).hexdigest()==source["sha256"]
          print("STAGE10_PUBLIC_GITHUB_PAGES_ACCEPTANCE=PASS")
          print("PUBLIC_APP="+root)
          print("VERIFIED_STATES=9")
          print("FIELD_CHECKLIST_ITEMS=7")
          print("PROVENANCE_JSON_AND_TWO_CSV_DOWNLOAD_CONTROLS=PASS")
          print("DELTA_REAL_SOURCE_GEOTIFF_SHA256=PASS")
          PY
