name: PetroScreen Stage 07 seven-state automated acquisition (research only)

on:
  pull_request:
    paths:
      - 'petroscreen-ng/acquire_additional_state.py'
      - 'petroscreen-ng/run_stage07_state_acceptance.py'
      - '.github/workflows/petroscreen-seven-states.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-acquisition:
    name: Source QA — ${{ matrix.state }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: [Abia, 'Akwa Ibom', Bayelsa, 'Cross River', Delta, Edo, Imo, Ondo, Rivers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned geospatial dependencies
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2
      - name: Acquire real ESA/JRC state extracts with 5km continuity halo
        run: python petroscreen-ng/acquire_additional_state.py --state "${{ matrix.state }}"
      - name: Verify geospatial screening at 1, 3 and 5 km
        run: python petroscreen-ng/run_stage07_state_acceptance.py --state "${{ matrix.state }}"
      - name: Publish scientific QA reports and source rasters for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-stage07-${{ strategy.job-index }}-state
          path: petroscreen-ng/artifacts_additional_states/
          retention-days: 7
          compression-level: 4
          if-no-files-found: warn

  nine-state-candidate-bundle:
    name: Package nine-state source-indexed research bundle
    needs: state-acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster, projection and image libraries
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2 pillow==11.3.0
      - name: Download accepted state clips from every matrix job
        uses: actions/download-artifact@v4
        with:
          pattern: petroscreen-stage07-*-state
          path: petroscreen-ng/artifacts_additional_states
          merge-multiple: true
      - name: Build checksum-verified nine-state lazy-loading catalogue
        run: python petroscreen-ng/build_nine_state_assets.py
      - name: Archive research-only region index and all rasters
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-nine-state-unpublished-preview-assets
          path: petroscreen-ng/web/public/data/
          retention-days: 7
          compression-level: 4
          if-no-files-found: error
