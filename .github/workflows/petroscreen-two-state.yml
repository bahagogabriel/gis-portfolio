name: PetroScreen Stage 06 two-state regional seam QA (research only)

on:
  pull_request:
    paths:
      - 'petroscreen-ng/**'
      - '.github/workflows/petroscreen-two-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-raster-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial libraries
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2 pillow==11.3.0
      - name: Build unified Bayelsa-Rivers raster data domain
        run: python petroscreen-ng/acquire_two_state.py
      - name: Check Bayelsa-Rivers 1/3/5-km reference screening and seam
        run: python petroscreen-ng/run_two_state_engine_acceptance.py
      - name: Archive reproducible source rasters and acceptance records (not public deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-two-state-scientific-engineering-qa
          path: petroscreen-ng/artifacts_two_state/
          retention-days: 14
          if-no-files-found: warn
