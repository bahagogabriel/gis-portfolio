name: PetroScreen Stage 06 two-state regional seam QA (research only)

on:
  pull_request:
    paths:
      - 'petroscreen-ng/**'
      - '.github/workflows/petroscreen-two-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-raster-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial libraries
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2 pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA/build libraries
        working-directory: petroscreen-ng/web
        run: npm install --no-audit --no-fund
      - name: Build unified Bayelsa-Rivers raster data domain
        run: python petroscreen-ng/acquire_two_state.py
      - name: Check Bayelsa-Rivers 1/3/5-km reference screening and seam
        run: python petroscreen-ng/run_two_state_engine_acceptance.py
      - name: Test 12 real browser/Python parity cases
        working-directory: petroscreen-ng/web
        run: node test/two-state-parity.mjs
      - name: Package regional GeoTIFFs, state boundaries and overview for standalone preview
        run: python petroscreen-ng/build_two_state_web_assets.py
      - name: Build the two-state standalone preview
        working-directory: petroscreen-ng/web
        run: npm run build
      - name: Install Chromium for desktop/mobile acceptance
        working-directory: petroscreen-ng/web
        run: npx playwright install --with-deps chromium
      - name: Browser QA — Rivers, Bayelsa border, regional PDF and no external traffic
        run: node petroscreen-ng/web/test/two-state-gui-smoke.mjs
      - name: Validate three source-attributed site-map PDFs
        run: |
          python -m pip install pymupdf==1.26.5
          python petroscreen-ng/validate_two_state_pdf.py
      - name: Archive standalone dual-state web-preview build (not deployed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-two-state-browser-preview
          path: petroscreen-ng/web/dist/
          retention-days: 14
          if-no-files-found: warn
      - name: Archive actual browser screenshots and mapped reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-two-state-browser-qa
          path: petroscreen-ng/artifacts_two_state_web/
          retention-days: 14
          if-no-files-found: warn
      - name: Archive reproducible source rasters and acceptance records (not public deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-two-state-scientific-engineering-qa
          path: petroscreen-ng/artifacts_two_state/
          retention-days: 14
          if-no-files-found: warn
