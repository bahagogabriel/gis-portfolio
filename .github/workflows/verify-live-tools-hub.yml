name: Independent live portfolio Tools hub publication audit
on:
  push:
    branches: ['feature/portfolio-interactive-tools-hub']
    paths: ['.github/workflows/verify-live-tools-hub.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Independently inspect published portfolio, Tools, PetroScreen and original source digest
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          base="https://bahagogabriel.com"
          expected_main="29ce7c6331c33bd5f47418abc28d1baa323dfa80"
          def fetch(url,timeout=55):
              req=urllib.request.Request(url,headers={
                  "User-Agent":"PetroScreen-Portfolio-Independent-Live-QA/1"})
              with urllib.request.urlopen(req,timeout=timeout) as res:
                  assert res.status==200,(url,res.status)
                  return res.read()
          home=tools=case=None
          for attempt in range(35):
              try:
                  home=fetch(base+"/").decode("utf-8")
                  tools=fetch(base+"/tools.html").decode("utf-8")
                  case=fetch(base+"/projects/petroscreen-ng.html").decode("utf-8")
                  if ("tools-spotlight" in home and "tools-directory-card" in tools
                      and "PetroScreen NG" in case
                      and "/tools.html" in home and "/petroscreen/" in tools):
                      break
              except Exception as exc: print("Site propagation:",type(exc).__name__)
              if attempt==34: raise RuntimeError("Published integrated Tools hub not found")
              time.sleep(7)
          assert tools.count("tools-directory-card")>=5
          assert "Niger Delta Gas-Flaring Evidence Atlas" in tools
          assert "Bayelsa Oil-Spill Evidence Atlas" in tools
          assert "Anambra Soil-Erosion Prioritization" in tools
          assert "Lokoja Flood Resilience" in tools
          assert "PetroScreen NG" in tools
          assert tools.count("https://bahagogabriel.github.io/")>=4
          assert 'href="/projects/petroscreen-ng.html"' in tools
          assert 'href="/petroscreen/"' in tools
          assert "From maps to tools you can use." in home
          assert "Independent geospatial software research" in case
          assert "31" in case and "1984" in case and "2021" in case
          assert "research preview" in case.lower()
          assert 'href="/tools.html"' in case
          assert fetch(base+"/petroscreen/").find(b"PetroScreen NG")>=0
          sitemap=ET.fromstring(fetch(base+"/sitemap.xml").lstrip())
          ns="{http://www.sitemaps.org/schemas/sitemap/0.9}"
          locations={e.text for e in sitemap.iter(ns+"loc")}
          for path in ("/tools.html","/projects/petroscreen-ng.html","/petroscreen/"):
              assert base+path in locations,("Missing sitemap entry",path)
          remote=fetch(base+"/petroscreen/data/manifest.json")
          raw="https://raw.githubusercontent.com/bahagogabriel/gis-portfolio/"
          original=fetch(raw+"429e8d94d0cad1a087b086885e456e569559756a/petroscreen/data/manifest.json")
          assert hashlib.sha256(remote).digest()==hashlib.sha256(original).digest(),(
              "Scientific source manifest differs from previously verified production")
          manifest=json.loads(remote)
          assert len(manifest["states"])==9
          assert sum(len(s["source_files"]) for s in manifest["state_sources"])==31
          overview=fetch(base+"/petroscreen/data/landcover_overview.webp")
          assert hashlib.sha256(overview).hexdigest()==manifest["overview"]["sha256"],(
              "PetroScreen overview checksum mismatch")
          print("PUBLIC_TOOLS_AND_PETROSCREEN_CASE_STUDY=PASS")
          print("PUBLIC_HOME_AND_NAV_AND_FIVE_VERIFIED_ENTRIES=PASS")
          print("PUBLIC_SITEMAP=PASS")
          print("LIVE_31_SOURCE_MANIFEST_UNCHANGED_AND_OVERVIEW_SHA256=PASS")
          print("PRODUCTION_MAIN="+expected_main)
          PY
