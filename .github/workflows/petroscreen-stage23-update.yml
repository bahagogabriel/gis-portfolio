name: PetroScreen Stage23 first-time walkthrough and results literacy release

on:
  push:
    branches: ['research/petroscreen-ng-stage23-first-run-guidance']
    paths:
      - '.github/workflows/petroscreen-stage23-update.yml'
      - '.github/workflows/petroscreen-stage23-live-qa.yml'
      - '.github/workflows/petroscreen-stage22-live-qa.yml'
      - 'petroscreen-ng/stage10_reference_proximity.py'
      - 'petroscreen-ng/web/src/**'
      - 'petroscreen-ng/web/test/**'
      - 'petroscreen-ng/web/index.html'
      - 'petroscreen-ng/STAGE23_FIRST_USE_AUDIT.md'
      - 'petroscreen-ng/validate_stage08_pdf.py'
      - 'petroscreen-ng/validate_stage14_bundle.py'
      - 'petroscreen-ng/validate_stage18_comparison.py'
  workflow_dispatch:

# Only the newest UI candidate is allowed to republish the preview branch.
concurrency:
  group: petroscreen-stage23-preview
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require screenshot-grounded human-review scope and limitations document
        run: test -s petroscreen-ng/STAGE23_FIRST_USE_AUDIT.md
      - name: Recover nine-state source rasters from the published GitHub tree
        run: |
          # Never depend on a short-lived CI artifact that expires after 7 days.
          # The production tree holds the identical, SHA256-pinned source files.
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/petroscreen-current /tmp/petroscreen-old-verified/data
          git archive origin/main petroscreen/data | tar -x -C /tmp/petroscreen-current
          cp -a /tmp/petroscreen-current/petroscreen/data/. /tmp/petroscreen-old-verified/data/
          mkdir -p petroscreen-ng/web/public/data
          cp -a /tmp/petroscreen-old-verified/data/. petroscreen-ng/web/public/data/
          test -f petroscreen-ng/web/public/data/manifest.json
      - name: Verify all 31 unchanged remote-sensing source files
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          dat=pathlib.Path('petroscreen-ng/web/public/data')
          m=json.loads((dat/'manifest.json').read_text())
          assert len(m['states'])==len(m['state_sources'])==9
          count=0
          for state in m['state_sources']:
            for f in state['source_files']:
              p=dat/f['file']
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==f['sha256'],p
              count+=1
          assert count==31,count
          print('SOURCE_DATA_UNCHANGED_AND_VERIFIED=31')
          PY
      - name: Exercise nine-state × 1/3/5-km boundary geometry matrix
        run: node petroscreen-ng/web/test/stage13-boundary-matrix.mjs
      - name: Install pinned JavaScript dependencies
        working-directory: petroscreen-ng/web
        run: npm install --no-audit --no-fund
      - name: Test scientific copy boundaries and guidance rules
        working-directory: petroscreen-ng/web
        run: npm test
      - name: Install independent scientific raster/projection reference environment
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 pyproj==3.7.2
      - name: Generate independent WGS84 geodesic nearest-pixel reference for 9 states
        run: python petroscreen-ng/stage10_reference_proximity.py
      - name: Compare 108 mapped pixel distances at 1/3/5 km against independent Python
        run: node petroscreen-ng/web/test/stage10-real-proximity-parity.mjs
      - name: Build new static report/UI code
        working-directory: petroscreen-ng/web
        run: npm run build
      - name: Install Chromium for real source-backed site screening
        working-directory: petroscreen-ng/web
        run: npx playwright install --with-deps chromium
      - name: Audit desktop/mobile UX, keyboard flow and WCAG 2.1 A/AA with axe-core
        run: node petroscreen-ng/web/test/stage19-ui-audit.mjs
      - name: Verify live native ESA palette, responsive map key and same-state TIFF reuse
        run: node petroscreen-ng/web/test/stage20-map-perf.mjs
      - name: Test real raster lightweight map toggle and recover from source HTTP failures
        run: node petroscreen-ng/web/test/stage21-mobile-resilience.mjs
      - name: Verify compact mobile and desktop legend plus view-only pilot extent reset
        run: node petroscreen-ng/web/test/stage22-map-usability.mjs
      - name: First-time desktop/mobile guide, example coordinate and interpretation integrity
        run: node petroscreen-ng/web/test/stage23-guided-first-use.mjs
      - name: Browser-test all nine states and download Delta/Rivers PDFs
        run: node petroscreen-ng/web/test/nine-state-gui-smoke.mjs
      - name: Inspect actual mapped PDFs and detect cutoff/state mistakes
        run: |
          python -m pip install pymupdf==1.26.5
          python petroscreen-ng/validate_stage08_pdf.py
      - name: Independently inspect actual Chromium case ZIPs and embedded mapped PDFs
        run: python petroscreen-ng/validate_stage14_bundle.py
      - name: Independently validate actual Stage18 comparison PDF layout and source-only disclosure
        run: python petroscreen-ng/validate_stage18_comparison.py
      - name: Cache fresh deployable build outside git before switching branches
        run: |
          mkdir -p /tmp/petroscreen-new
          cp -a petroscreen-ng/web/dist/. /tmp/petroscreen-new/
      - name: Create safely scoped Pages pull-request branch from deployed main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -b preview/petroscreen-stage23-live origin/main
          test "$(cat CNAME)" = "bahagogabriel.com"
          test -f index.html
          test -f petroscreen/index.html
          rm -rf petroscreen
          mkdir petroscreen
          cp -a /tmp/petroscreen-new/. petroscreen/
          test -f petroscreen/index.html
          test -f petroscreen/data/manifest.json
          git add -A petroscreen
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ux(petroscreen): guided manifest-backed example and source-data comprehension'
          if git diff --name-only origin/main HEAD | grep -Ev '^petroscreen/'; then
            echo 'ABORT: unexpected change to portfolio files' >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib,pathlib,json
          old=pathlib.Path('/tmp/petroscreen-old-verified/data')
          now=pathlib.Path('petroscreen/data')
          m=json.loads((now/'manifest.json').read_text())
          num=0
          for s in m['state_sources']:
            for f in s['source_files']:
              r=f['file']
              a,b=(old/r).read_bytes(),(now/r).read_bytes()
              assert hashlib.sha256(a).digest()==hashlib.sha256(b).digest()
              num+=1
          assert num==31,num
          assert pathlib.Path('CNAME').read_text().strip()=='bahagogabriel.com'
          print('SAFE_ONLY_PETROSCREEN_CHANGED_AND_31_RASTERS_IDENTICAL=PASS')
          PY
          # Block any superseded build from overwriting a newer UI release.
          git fetch origin refs/heads/research/petroscreen-ng-stage23-first-run-guidance
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
            echo 'ABORT: research branch advanced after this run; refuse stale preview' >&2
            exit 1
          }
          # Preview is disposable and always generated from current main. Lease
          # prevents overwriting unexpected third-party modifications.
          git fetch origin refs/heads/preview/petroscreen-stage23-live:refs/remotes/origin/preview/petroscreen-stage23-live || true
          git push --force-with-lease origin HEAD:refs/heads/preview/petroscreen-stage23-live
      - name: Verify Pages/Jekyll compatibility before PR
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Validate original homepage and new page survive
        run: |
          test -f _site/index.html
          test "$(cat _site/CNAME)" = 'bahagogabriel.com'
          test -f _site/petroscreen/index.html
          test -f _site/petroscreen/data/manifest.json
          echo 'PREMERGE_PORTFOLIO_AND_PETROSCREEN_COMPATIBILITY=PASS'
      - name: Store browser PDF QA artifacts for reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-stage23-first-use
          path: |
            petroscreen-ng/artifacts_nine_state/
            petroscreen-ng/artifacts_stage10/
            petroscreen-ng/artifacts_stage19/
            petroscreen-ng/artifacts_stage20/
            petroscreen-ng/artifacts_stage21/
            petroscreen-ng/artifacts_stage22/
            petroscreen-ng/artifacts_stage23/
          if-no-files-found: warn
          retention-days: 14
