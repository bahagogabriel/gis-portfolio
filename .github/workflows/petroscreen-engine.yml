name: PetroScreen Stage 02 analytical engine QA (research only)

on:
  pull_request:
    paths:
      - 'petroscreen-ng/**'
      - '.github/workflows/petroscreen-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source geospatial dependencies
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2
      - name: Run independent synthetic input and no-data tests
        run: python -m unittest discover -s petroscreen-ng -p 'test_*.py' -v

  real-bayelsa-samples:
    needs: offline-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source geospatial dependencies
        run: python -m pip install numpy==2.3.5 rasterio==1.4.3 shapely==2.1.2 pyproj==3.7.2
      - name: Reproduce Bayelsa real-data clips from public sources
        run: python petroscreen-ng/acquire_bayelsa.py
      - name: Verify source SHA-256, geometry, and cross-grid coverage
        run: python petroscreen-ng/validate_bayelsa.py
      - name: Run site-screening engine on actual Bayelsa files
        run: python petroscreen-ng/run_stage02_acceptance.py
      - name: Retain reports (do not publish any maps or user locations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petroscreen-stage02-evidence
          path: |
            petroscreen-ng/artifacts_bayelsa/acquisition_report.json
            petroscreen-ng/artifacts_bayelsa/geodesic_area_qa.json
            petroscreen-ng/artifacts_bayelsa/stage02_real_data_qa.json
            petroscreen-ng/artifacts_bayelsa/example_screen_seam_1km.json
          retention-days: 14
          if-no-files-found: warn
